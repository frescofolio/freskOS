<!-- 1. Estructura de la Pantalla de Carga Estilo Mac -->
<div id="mac-loader-screen">
  
    <!-- Botón de Encendido Inicial -->
    <button id="mac-power-btn" aria-label="Encender">
      <svg viewBox="0 0 24 24">
        <path d="M12 2v10M18.36 5.64a9 9 0 1 1-12.73 0" />
      </svg>
    </button>
  
    <!-- Contenedor del Loader (Oculto al inicio) -->
    <div class="mac-loader-container" id="mac-loader-content">
      <!-- Tu logo como imagen -->
      <img class="mac-logo" src="./Assets/Icons/1st.png" alt="Logo">
      
      <!-- Barra de progreso -->
      <div class="mac-progress-bar">
        <div class="mac-progress-fill" id="mac-progress-fill"></div>
      </div>
    </div>
  </div>
  
  <style>
  /* 2. Estilos Aislados */
  #mac-loader-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: #000000;
    z-index: 999999;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: opacity 0.6s ease;
  }
  
  /* Botón de encendido minimalista estilo Apple */
  #mac-power-btn {
    background: none;
    border: none;
    cursor: pointer;
    padding: 20px;
    transition: transform 0.2s ease, opacity 0.3s ease;
  }
  
  #mac-power-btn:hover {
    transform: scale(1.1);
  }
  
  #mac-power-btn svg {
    width: 60px;
    height: 60px;
    stroke: #555555; /* Color gris apagado inicial */
    stroke-width: 2;
    stroke-linecap: round;
    fill: none;
    transition: stroke 0.3s ease;
  }
  
  #mac-power-btn:hover svg {
    stroke: #ffffff; /* Se ilumina al pasar el mouse */
  }
  
  /* Contenedor del contenido (Logo + Barra) */
  .mac-loader-container {
    display: none; /* Escondido hasta que se pulse el botón */
    flex-direction: column;
    align-items: center;
    width: 150px;
  }
  
  .mac-logo {
    width: 120px;
    height: auto;
    display: block;
    margin-bottom: 45px;
  }
  
  .mac-progress-bar {
    width: 100%;
    height: 4px;
    background-color: #424242;
    border-radius: 2px;
    overflow: hidden;
  }
  
  .mac-progress-fill {
    width: 0%;
    height: 100%;
    background-color: #ffffff;
    transition: width 0.05s linear;
  }
  
  /* Clases de animación */
  #mac-loader-screen.fade-out {
    opacity: 0;
    pointer-events: none;
  }
  </style>
  
  <script>
  // 3. Lógica de Activación por Botón y Carga Fija
  document.addEventListener("DOMContentLoaded", () => {
    const powerBtn = document.getElementById("mac-power-btn");
    const loaderContent = document.getElementById("mac-loader-content");
    const progressFill = document.getElementById("mac-progress-fill");
    const loaderScreen = document.getElementById("mac-loader-screen");
    
    // Configuración de tu sonido de arranque
    const sonidoArranque = new Audio("./Audio/freskOS.mp3");
    sonidoArranque.volume = 0.6;
  
    powerBtn.addEventListener("click", () => {
      // 1. Desvanecer botón y reproducir sonido con permiso garantizado
      powerBtn.style.opacity = "0";
      setTimeout(() => powerBtn.style.display = "none", 300);
      
      sonidoArranque.play().catch(e => console.log("Error de audio:", e));
  
      // 2. Mostrar logo y barra de carga
      setTimeout(() => {
        loaderContent.style.display = "flex";
        iniciarAnimacionCarga();
      }, 400);
    });
  
    function iniciarAnimacionCarga() {
      const DURACION_TOTAL = 5000; 
      const INTERVALO_TIEMPO = 50; 
      let tiempoTranscurrido = 0;
  
      const simuladorCarga = setInterval(() => {
        tiempoTranscurrido += INTERVALO_TIEMPO;
        let progreso = (tiempoTranscurrido / DURACION_TOTAL) * 100;
  
        // Ritmo asincrónico estilo Mac
        let progresoVisual = progreso;
        if (progreso > 25 && progreso < 50) {
          progresoVisual = progreso * 0.75; 
        } else if (progreso >= 50 && progreso < 80) {
          progresoVisual = progreso * 0.93; 
        } else if (progreso >= 80 && progreso < 99) {
          progresoVisual = progreso * 0.97; 
        }
  
        if (progresoVisual >= 99) {
          progresoVisual = 99;
        }
  
        progressFill.style.width = `${progresoVisual}%`;
  
        if (tiempoTranscurrido >= DURACION_TOTAL) {
          clearInterval(simuladorCarga);
          progressFill.style.width = "100%"; 
          
          setTimeout(() => {
            loaderScreen.classList.add("fade-out");
          }, 400);
        }
      }, INTERVALO_TIEMPO);
    }
  });
  </script>
